# mosquitto config for running the CocoaMQTT broker-dependent tests
# locally on a single host. Anonymous on:
#   1883  plain MQTT  (tests CocoaMQTTTests.testConnect etc.)
#   8083  MQTT over WebSocket (testWebsocketConnect)
#   8883  MQTT over TLS, self-signed cert (testOnyWaySSL, testTwoWaySLL --
#         both use mqtt.allowUntrustCACertificate = true, so the cert
#         only needs to exist; the broker does not validate any client
#         certificate, so testTwoWaySLL passes with its bundled .p12
#         even though it is signed by an unrelated CA)
#
# Generate the self-signed cert next to this file:
#   openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
#       -keyout test-broker.key -out test-broker.crt \
#       -subj "/CN=localhost" \
#       -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#
# Then run:
#   mosquitto -c CocoaMQTTTests/Fixtures/test-broker.conf -v
#
# See CocoaMQTTTests/Fixtures/README.md.

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

listener 8083 0.0.0.0
protocol websockets

listener 8883 0.0.0.0
protocol mqtt
certfile CocoaMQTTTests/Fixtures/test-broker.crt
keyfile  CocoaMQTTTests/Fixtures/test-broker.key

persistence false
log_dest stderr
